x-gateway: &gateway
  build: .
  restart: unless-stopped
  env_file: .env
  command: ["python", "src/gateway/app.py"] # O CMD do Dockerfile roda o main.py (roteiro de testes)

services:
  hivemq:
    image: hivemq/hivemq-ce:2026.5
    container_name: cnpem_hivemq
    profiles: [central]
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - hivemq-data:/opt/hivemq/data
      - hivemq-log:/opt/hivemq/log

  coordenador:
    <<: *gateway
    profiles: [central]
    environment:
      PAPEL: coordenador
      BROKER_HOST: hivemq
    volumes:
      - ./src:/app/src
    depends_on:
      - hivemq

  coletor:
    <<: *gateway
    profiles: [coletor]
    environment:
      PAPEL: coletor # BROKER_HOST vem do .env, é o IP da máquina que tem o broker
    network_mode: host # também dá ao container o hostname da máquina, que é o id do coletor
    privileged: true
    volumes:
      - ./src:/app/src
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

volumes:
  hivemq-data:
  hivemq-log:
